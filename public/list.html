<!doctype html>
<html lang='en'>
    <head>
    <title>To Do List</title>
    <meta charset='utf-8'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel='icon' href='data:;base64,iVBORw0KGgo='>
    <script src="js/list.js"></script>
    <meta name="description" content="View and modify your to-do list tasks.">

  </head>

  <body>
    <main class="container mt-4">
    <button id="logout-btn" class="btn btn-outline-secondary">Log Out</button>
    <script src="js/authenticate.js"></script>
    <h1>To Do</h1>
    <table id="todo-table" class="table table-striped table-hover align-middle">
        <thead>
            <tr>
                <th>Task</th>
                <th>Category</th>
                <th>Created</th>
                <th>Deadline</th>
                <th>Priority</th>
                <th> Action </th>
            </tr>
        </thead>
        <tbody id="list-body">
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary">Back to Form</a>
    </main>
  </body>
</html>
