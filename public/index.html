<!doctype html>
<html lang='en'>
  <head>
    <title>CS 4241 A3</title>
    <meta charset='utf-8'>
    <script src='js/main.js'></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo='>
    <meta name="description" content="Add a new task to the to-do list.">
  </head>


  <body>
    <main class="container mt-4">
    <button id="logout-btn" class="btn btn-outline-secondary">Log Out</button>
    <script src="js/authenticate.js"></script>
    <form>
    <h1>Add a Task</h1>
    <p class="mb-3">
        <label for="task" class="form-label">Task:</label>
        <input type="text" id="task" name="user_name" class="form-control">
    </p>
    <p class="mb-3">
        <label for="deadline">Deadline:</label>
        <input type="datetime-local" 
        id="deadline" 
        name="deadline"
        min="2026-09-04T00:00"
        max="2026-12-31T23:59">
    </p>
    <p class="mb-3">
        <label for="creation-date">Creation Date:</label>
        <input type="datetime-local" 
        id="creation-date" 
        name="creation-date"
        min="2026-09-04T00:00"
        max="2026-12-31T23:59">
    </p>
    <p class="mb-3">
        <label for="category" class="form-label">Choose a category:</label>
        <select id="category" name="category" class="form-select">
            <option value="classes">Classes</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
        </select>
    </p>
    <p class="mb-3">
        <span class="form-label">Recurring task?</span>
        <label><input type="radio" name="recurring" value="yes" class="form-check-input"> Yes</label>
        <label><input type="radio" name="recurring" value="no" checked class="form-check-input"> No</label>
    </p>
    <br>
    <button type="submit" class="btn btn-primary">Add</button>
    <br>
    </form>
    <br>
    <a href="/list.html" class="btn btn-secondary">View Current Tasks</a>
    </main>
  </body>
</html>
